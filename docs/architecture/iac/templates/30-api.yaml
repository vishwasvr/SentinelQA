AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - HTTP API + TypeScript Lambdas with least-privilege roles. Not deployed. AI routes deferred (/api/ai/* not routed).
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  EnvProfile:
    Type: String
    AllowedValues: [lean, strict]
    Default: lean
    Description: lean = non-prod (dev/stage), strict = prod (ADR-0013)
  RecordsApiKey:
    Type: String
    AllowedPattern: '^[0-9a-f]{7,40}/records-api\.zip$'
    Description: <commit-sha>/records-api.zip, supplied by the pipeline (ADR-0014)
  ReportsApiKey:
    Type: String
    AllowedPattern: '^[0-9a-f]{7,40}/reports-api\.zip$'
    Description: <commit-sha>/reports-api.zip, supplied by the pipeline (ADR-0014)
  ThrottleRate:
    Type: Number
    Default: 10          # O-05 decided 2026-10-13
  ThrottleBurst:
    Type: Number
    Default: 20
Conditions:
  IsStrict: !Equals [!Ref EnvProfile, strict]
Resources:
  # O-09: tables use the AWS managed key aws/dynamodb (authorized via the DynamoDB service, no kms:* needed for DynamoDB).
  # The origin-verify SecureString (ADR-0015, aws/ssm) DOES need kms:Decrypt: conditioned on ViaService ssm, alias aws/ssm
  # (mirrors AppRoleBoundary AllowSsmSecureStringDecrypt in 00-bootstrap.yaml) and pinned to that parameter's encryption context.
  # kms:ResourceAliases on an AWS managed key is UNVERIFIED in a live account (dev smoke test, developer review #26).
  RecordsApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SentinelQA-${EnvName}-records-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      PermissionsBoundary: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AppRoleBoundaryArn' }
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow                     # own log group only (no managed AWSLambdaBasicExecutionRole wildcards)
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/SentinelQA-${EnvName}-records-api:*'
              - !If
                - IsStrict
                - { Effect: Allow, Action: [xray:PutTraceSegments, xray:PutTelemetryRecords], Resource: '*' }   # X-Ray Active in strict
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource:
                  - { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
                  - !Sub [ '${T}/index/*', { T: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' } } ]
              - Effect: Allow
                Action: dynamodb:PutItem          # append-only audit (conditional put attribute_not_exists in code)
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
              - Effect: Allow                     # read-only timeline (US-03, BR-08, BR-36) + prevHash lookup
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  - { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
                  - !Sub [ '${T}/index/*', { T: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' } } ]
              - Effect: Deny                      # ADR-0006 / QA-28: no in-place change or removal of audit items, incl. PartiQL
                Action: [dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem, dynamodb:PartiQLUpdate, dynamodb:PartiQLDelete, dynamodb:PartiQLInsert]
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
              - Effect: Deny                      # QA-28: audit PutItem only inside TransactWriteItems (with its record change). UNVERIFIED until #26 dev smoke proves it.
                Action: dynamodb:PutItem
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
                Condition:
                  StringNotEquals:
                    'dynamodb:EnclosingOperation': TransactWriteItems
              - Effect: Deny                      # ALL envs: removals are soft deletes + audit event (BRD v1.4 §13.1)
                Action: [dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]   # BR-47 config, markers, origin-verify SecureString (ADR-0015)
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/*'
              - Effect: Allow                     # ADR-0015: decrypt ONLY the origin-verify SecureString (aws/ssm, via SSM)
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    'kms:EncryptionContext:PARAMETER_ARN': !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/edge/origin-verify'
                  'ForAnyValue:StringEquals': { 'kms:ResourceAliases': alias/aws/ssm }
  ReportsApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SentinelQA-${EnvName}-reports-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      PermissionsBoundary: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AppRoleBoundaryArn' }
      Policies:
        - PolicyName: read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow                     # own log group only (no managed AWSLambdaBasicExecutionRole wildcards)
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/SentinelQA-${EnvName}-reports-api:*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  - { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
                  - !Sub [ '${T}/index/*', { T: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' } } ]
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]   # config, markers, origin-verify SecureString (ADR-0015)
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/*'
              - Effect: Allow                     # ADR-0015: decrypt ONLY the origin-verify SecureString (aws/ssm, via SSM)
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    'kms:EncryptionContext:PARAMETER_ARN': !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/edge/origin-verify'
                  'ForAnyValue:StringEquals': { 'kms:ResourceAliases': alias/aws/ssm }
  RecordsApiFn:
    Type: AWS::Lambda::Function
    DependsOn: RecordsLogs        # create the log group first (dev #18)
    Properties:
      FunctionName: !Sub SentinelQA-${EnvName}-records-api
      Runtime: nodejs24.x          # TypeScript compiled to JS (D-09)
      Handler: index.handler
      Architectures: [arm64]
      Timeout: 10
      MemorySize: 512
      Role: !GetAtt RecordsApiRole.Arn
      Code: { S3Bucket: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-ArtifactBucketName' }, S3Key: !Ref RecordsApiKey }
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          DOMAIN_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableName' }
          AUDIT_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableName' }
          CONTROLLED_GATE_MODE: block       # D-14
          ORIGIN_VERIFY_PARAM: !Sub /sentinelqa/${EnvName}/edge/origin-verify   # ADR-0015 SecureString, cached 5 min
      TracingConfig: { Mode: !If [IsStrict, Active, PassThrough] }
  ReportsApiFn:
    Type: AWS::Lambda::Function
    DependsOn: ReportsLogs
    Properties:
      FunctionName: !Sub SentinelQA-${EnvName}-reports-api
      Runtime: nodejs24.x
      Handler: index.handler
      Architectures: [arm64]
      Timeout: 10
      MemorySize: 512
      Role: !GetAtt ReportsApiRole.Arn
      Code: { S3Bucket: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-ArtifactBucketName' }, S3Key: !Ref ReportsApiKey }
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          DOMAIN_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableName' }
          ORIGIN_VERIFY_PARAM: !Sub /sentinelqa/${EnvName}/edge/origin-verify
      TracingConfig: { Mode: PassThrough }
  RecordsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/SentinelQA-${EnvName}-records-api
      RetentionInDays: !If [IsStrict, 30, 7]   # O-02 decided: prod 30 days; lean 7 days
  ReportsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/SentinelQA-${EnvName}-reports-api
      RetentionInDays: !If [IsStrict, 30, 7]
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub SentinelQA-${EnvName}-api
      ProtocolType: HTTP
      # Authorizer seam (ADR-0008): add AWS::ApiGatewayV2::Authorizer (JWT/Cognito) later
  RecordsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RecordsApiFn.Arn
      PayloadFormatVersion: '2.0'
  ReportsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReportsApiFn.Arn
