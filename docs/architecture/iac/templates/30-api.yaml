AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - HTTP API + TypeScript Lambdas with least-privilege roles. Not deployed. AI routes deferred (/api/ai/* not routed).
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  EnvProfile:
    Type: String
    AllowedValues: [lean, strict]
    Default: lean
    Description: lean = non-prod (dev/stage), strict = prod (ADR-0013)
  ArtifactBucket:
    Type: String
  RecordsApiKey:
    Type: String
  ReportsApiKey:
    Type: String
  ThrottleRate:
    Type: Number
    Default: 20          # TODO O-05
  ThrottleBurst:
    Type: Number
    Default: 40
Conditions:
  IsStrict: !Equals [!Ref EnvProfile, strict]
Resources:
  # O-09: no kms:* permissions needed; tables use the AWS managed key aws/dynamodb (authorized via the DynamoDB service)
  RecordsApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SentinelQA-${EnvName}-records-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: !If
        - IsStrict
        - [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole', !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess']   # X-Ray Active in strict
        - [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole']
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource:
                  - { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
                  - !Sub [ '${T}/index/*', { T: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' } } ]
              - Effect: Allow
                Action: dynamodb:PutItem          # append-only audit (conditional put in code)
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
              - Effect: Deny                      # ADR-0006
                Action: [dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
              - Effect: Deny
                Action: [dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/*'
  ReportsApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SentinelQA-${EnvName}-reports-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole']
      Policies:
        - PolicyName: read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  - { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
                  - !Sub [ '${T}/index/*', { T: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableArn' } } ]
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sentinelqa/${EnvName}/*'
  RecordsApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub SentinelQA-${EnvName}-records-api
      Runtime: nodejs24.x          # TypeScript compiled to JS (D-09)
      Handler: index.handler
      Architectures: [arm64]
      Timeout: 10
      MemorySize: 512
      Role: !GetAtt RecordsApiRole.Arn
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref RecordsApiKey }
      Environment:
        Variables:
          ENV_NAME: !Ref EnvName
          DOMAIN_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableName' }
          AUDIT_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AuditLogTableName' }
          CONTROLLED_GATE_MODE: block       # D-14
      TracingConfig: { Mode: !If [IsStrict, Active, PassThrough] }
  ReportsApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub SentinelQA-${EnvName}-reports-api
      Runtime: nodejs24.x
      Handler: index.handler
      Architectures: [arm64]
      Timeout: 10
      Role: !GetAtt ReportsApiRole.Arn
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ReportsApiKey }
      Environment:
        Variables:
          DOMAIN_TABLE: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-DomainTableName' }
  RecordsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/SentinelQA-${EnvName}-records-api
      RetentionInDays: !If [IsStrict, 90, 7]   # O-02; lean 7 days
  ReportsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/SentinelQA-${EnvName}-reports-api
      RetentionInDays: !If [IsStrict, 90, 7]
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub SentinelQA-${EnvName}-api
      ProtocolType: HTTP
      # Authorizer seam (ADR-0008): add AWS::ApiGatewayV2::Authorizer (JWT/Cognito) later
  RecordsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RecordsApiFn.Arn
      PayloadFormatVersion: '2.0'
  ReportsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReportsApiFn.Arn
      PayloadFormatVersion: '2.0'
  # BEGIN GENERATED ROUTES (iac/tools/gen-routes.py from api/openapi.yaml; do not edit)
