      DefaultRouteSettings: { ThrottlingRateLimit: !Ref ThrottleRate, ThrottlingBurstLimit: !Ref ThrottleBurst }
  RecordsInvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RecordsApiFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*
  ReportsInvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReportsApiFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*
Outputs:
  ApiId:
    Value: !Ref HttpApi
    Export: { Name: !Sub 'SentinelQA-${EnvName}-ApiId' }
  ApiDomain:
    Value: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export: { Name: !Sub 'SentinelQA-${EnvName}-ApiDomain' }
  RecordsFnName:
    Value: !Ref RecordsApiFn
    Export: { Name: !Sub 'SentinelQA-${EnvName}-RecordsFnName' }
