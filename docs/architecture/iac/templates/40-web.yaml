AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - S3 SPA + CloudFront (/api/* to HTTP API). WAF deferred (ADR-0011). Not deployed.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Value(s) of SSM SecureString /sentinelqa/<env>/edge/origin-verify, read by the pipeline at deploy time
      (CloudFormation cannot resolve ssm-secure in CloudFront). Never stored in params files (ADR-0015)
  WebACLArn:
    Type: String
    Default: ''          # D-11 deferred: leave empty
Conditions:
  HasWaf: !Not [!Equals [!Ref WebACLArn, '']]
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      Tags: [{ Key: env, Value: !Ref EnvName }]
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub SentinelQA-${EnvName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        WebACLId: !If [HasWaf, !Ref WebACLArn, !Ref AWS::NoValue]
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-ApiDomain' }
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
            OriginCustomHeaders:          # ADR-0015: records/reports-api reject requests without it (403) before any auth
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}' } }
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Export: { Name: !Sub 'SentinelQA-${EnvName}-DistributionDomain' }
