AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - CloudWatch alarms to SNS email (D-10). Agent/AI alarms (BR-30) deferred with AI. Not deployed.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
Resources:
  RecordsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-records-api-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-RecordsFnName' } }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
  # TODO: API 5xx, throttles, DynamoDB SystemErrors, gate-block count (custom metric), Budgets
