AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - CloudWatch alarms to SNS email (D-10). lean = 1 alarm, strict = 5 here (+2 in 25-backup); 12 alarm metrics account-wide. Agent/AI alarms (BR-30) deferred with AI. Not deployed.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  EnvProfile:
    Type: String
    AllowedValues: [lean, strict]
    Default: lean
    Description: lean = non-prod (dev/stage), strict = prod (ADR-0013)
Conditions:
  IsStrict: !Equals [!Ref EnvProfile, strict]
Resources:
  RecordsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-records-api-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-RecordsFnName' } }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
  # strict-only alarms
  ApiServerErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: IsStrict
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-ApiServerErrors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: { 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-ApiId' } }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
  DomainSystemErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: IsStrict
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-DomainSystemErrors
      AlarmDescription: DynamoDB HTTP 500s on the Domain table. SystemErrors is published only per TableName+Operation, so the main operations are summed (3 alarm metrics).
      Metrics:
        - Id: total
          Expression: FILL(m0,0)+FILL(m1,0)+FILL(m2,0)
          Label: SystemErrors
          ReturnData: true
        - Id: m0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions: [{ Name: TableName, Value: !Sub 'SentinelQA-${EnvName}-Domain' }, { Name: Operation, Value: TransactWriteItems }]
            Period: 300
            Stat: Sum
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions: [{ Name: TableName, Value: !Sub 'SentinelQA-${EnvName}-Domain' }, { Name: Operation, Value: Query }]
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions: [{ Name: TableName, Value: !Sub 'SentinelQA-${EnvName}-Domain' }, { Name: Operation, Value: GetItem }]
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
  AuditSystemErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: IsStrict
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-AuditSystemErrors
      AlarmDescription: DynamoDB HTTP 500s on AuditLog writes (audit puts ride in TransactWriteItems) and timeline reads. Replaces the account-level UserErrors alarm (infra M-2).
      Metrics:
        - Id: total
          Expression: FILL(m0,0)+FILL(m1,0)
          Label: SystemErrors
          ReturnData: true
        - Id: m0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions: [{ Name: TableName, Value: !Sub 'SentinelQA-${EnvName}-AuditLog' }, { Name: Operation, Value: TransactWriteItems }]
            Period: 300
            Stat: Sum
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions: [{ Name: TableName, Value: !Sub 'SentinelQA-${EnvName}-AuditLog' }, { Name: Operation, Value: Query }]
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
  GateBlocks:                    # metric is a CODE CONTRACT: records-api emits it via EMF (Powertools Metrics)
    Type: AWS::CloudWatch::Alarm
    Condition: IsStrict
    Properties:
      AlarmName: !Sub SentinelQA-${EnvName}-GateBlocks
      Namespace: SentinelQA
      MetricName: ControlledDataBlocked
      Dimensions: [{ Name: Env, Value: !Ref EnvName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [{ 'Fn::ImportValue': !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }]
