AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - alarm topic (email), budget. No customer-managed KMS keys (O-09). Not deployed.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  AlarmEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be a single email address (name@domain.tld); set per env in params (InfraDeploy)
Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub SentinelQA-${EnvName}-alarms
      KmsMasterKeyId: alias/aws/sns     # AWS managed key (O-09)
      Subscription: [{ Protocol: email, Endpoint: !Ref AlarmEmail }]   # D-10 email only
  # TODO: CloudTrail trail (account-level, create once, not per env); AWS::Budgets::Budget
Outputs:
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export: { Name: !Sub 'SentinelQA-${EnvName}-AlarmTopicArn' }
