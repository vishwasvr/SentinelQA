AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelQA SKELETON - DynamoDB Domain + AuditLog (7-year retention, no TTL), SSM config. Not deployed.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, stage, prod]
  EnvProfile:
    Type: String
    AllowedValues: [lean, strict]
    Default: lean
    Description: lean = non-prod (dev/stage), strict = prod (ADR-0013)
Conditions:
  IsStrict: !Equals [!Ref EnvProfile, strict]
Resources:
  DomainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # D-03 as amended (O-08): 7-year retention in prod only. Lean = synthetic data, delete manually if needed
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub SentinelQA-${EnvName}-Domain
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsStrict, true, false]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: !If [IsStrict, true, false] }   # strict: REQUIRED for incremental export (O-01); lean: off
      SSESpecification:            # O-09: strict = AWS managed key aws/dynamodb (no KMSMasterKeyId); lean = AWS owned key
        SSEEnabled: !If [IsStrict, true, false]
        SSEType: !If [IsStrict, KMS, !Ref AWS::NoValue]
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: dueAt, AttributeType: S }      # generic sparse due attribute (overview §5.1)
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: needByAt, AttributeType: S }   # CAPA/NCMR need-by date (BR-15), separate from dueAt (dev #29)
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }    # WS#<workspaceId> (tenancy seam)
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1               # sparse review queue: GSI1PK=WS#<ws>#REVIEWQ only while awaiting review; GSI1SK=<severityRank>#<openedAt> (BR-14)
          KeySchema: [{ AttributeName: GSI1PK, KeyType: HASH }, { AttributeName: GSI1SK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2               # sparse due index: GSI2PK=WS#<ws>#DUE#<entityType>, dueAt copied from the entity's own due date (quality record dueDate, BR-18, BR-25, training)
          KeySchema: [{ AttributeName: GSI2PK, KeyType: HASH }, { AttributeName: dueAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3               # sparse need-by index: GSI3PK=WS#<ws>#NEEDBY, needByAt=open CAPA/NCMR needByDate (BR-15 "Threatens delivery")
          KeySchema: [{ AttributeName: GSI3PK, KeyType: HASH }, { AttributeName: needByAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      Tags: [{ Key: env, Value: !Ref EnvName }]
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub SentinelQA-${EnvName}-AuditLog
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsStrict, true, false]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: !If [IsStrict, true, false] }   # strict: REQUIRED for incremental export (O-01); lean: off
      SSESpecification:            # O-09: strict = AWS managed key aws/dynamodb (no KMSMasterKeyId); lean = AWS owned key
        SSEEnabled: !If [IsStrict, true, false]
        SSEType: !If [IsStrict, KMS, !Ref AWS::NoValue]
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }   # WS#<ws>#ENT#<entityId>
        - { AttributeName: SK, AttributeType: S }   # <ts>#<ulid>
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      # No StreamSpecification: no WORM archive (D-05). No TTL (D-03).
      Tags: [{ Key: env, Value: !Ref EnvName }]
  # D-07 configurable values (placeholders; real values supplied later)
  RiskWeightsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/supplier-risk/weights
      Type: String
      Description: PLACEHOLDER BR-47 defaults (DP-16). Vishwas tunes later. Not validated values
      Value: '{"placeholder":true,"weights":{"openScars":0.25,"onTimePct":0.25,"criticality":0.25,"certFreshness":0.25},"bands":[{"name":"At risk","min":0},{"name":"Watch","min":60},{"name":"Approved","min":80}]}'   # DP-16 schema (decided); values PLACEHOLDER; weights sum to 1 within 0.001
  DueSoonParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/due-soon-days
      Type: String
      Description: PLACEHOLDER BR-47 due-soon thresholds in days (DP-16). Vishwas tunes later
      Value: '{"status":"PLACEHOLDER","calibration":30,"training":30,"supplierReeval":30}'
  CapaDefaultDueDaysParam:   # DP-20 (decided 2026-10-13): CAPA/NCMR dueDate = open date + N days; N configurable, ships as PLACEHOLDER
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/capa-ncmr/default-due-days
      Type: String
      Description: PLACEHOLDER N for CAPA/NCMR default dueDate (open date + N days, DP-20). Vishwas tunes later
      Value: '{"status":"PLACEHOLDER","days":30}'
  WorkspaceTimezoneParam:    # DP-12 (decided 2026-10-13)
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/workspace/timezone
      Type: String
      Description: Workspace timezone for day counts, IDs and trends (DP-12)
      Value: America/New_York
  ControlledMarkersParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/controlled-data/markers
      Type: StringList
      Description: BR-44 / D-14 KEYWORD markers. Literal, matched whole-word and case-insensitive (BRD v1.4). Marker id = K<list position>
      Value: 'ITAR,EAR,EAR99,ECCN,CUI,NOFORN,Distribution Statement,export controlled'
  ControlledCfrRangesParam:   # dev #27: CFR ranges as structured data, not literals (BR-44 reading; signed off DP-03, 2026-10-13)
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sentinelqa/${EnvName}/controlled-data/cfr-ranges
      Type: String
      Description: BR-44 / D-14 CFR range markers. Gate finds citations (title, CFR, optional Part or section sign, part, optional .section) and checks the part in code. Marker id = R<list position>
      Value: '[{"title":22,"partFrom":120,"partTo":130},{"title":15,"partFrom":730,"partTo":774}]'
Outputs:
  DomainTableArn:
    Value: !GetAtt DomainTable.Arn
    Export: { Name: !Sub 'SentinelQA-${EnvName}-DomainTableArn' }
  DomainTableName:
    Value: !Ref DomainTable
    Export: { Name: !Sub 'SentinelQA-${EnvName}-DomainTableName' }
  AuditLogTableArn:
    Value: !GetAtt AuditLogTable.Arn
    Export: { Name: !Sub 'SentinelQA-${EnvName}-AuditLogTableArn' }
  AuditLogTableName:
    Value: !Ref AuditLogTable
    Export: { Name: !Sub 'SentinelQA-${EnvName}-AuditLogTableName' }
