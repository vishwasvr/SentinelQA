openapi: 3.1.0
info:
  title: SentinelQA API
  version: 0.5.0
  description: 'Source of truth for the records-api / reports-api routes (architecture v0.5, BRD v1.4). Skeleton contract: only BRD-backed fields; decided fields carry `x-decision: DP-nn` (decisions 2026-10-13,
    docs/requirements/dp-proposals.md); remaining open items are `x-tbd`.


    Conventions:

    - **Origin**: every request must carry the CloudFront-injected `X-Origin-Verify` header, checked before anything else (403 forbidden_origin, ADR-0015).

    - **Errors**: `application/problem+json` (`Problem`).

    - **Pagination**: `?limit` (1–100, default 25) + opaque `?cursor`; response `{items, nextCursor}`.

    - **Idempotency**: `Idempotency-Key` (UUID) required on every POST; 24 h dedupe record in the Domain table plus `ClientRequestToken` on TransactWriteItems.

    - **Concurrency**: `version` attribute; responses carry `ETag`; PATCH/DELETE/actions need `If-Match` (428 if missing, 412 if stale). Stage moves are additionally conditional on `fromStage` (409).

    - **Soft delete**: DELETE sets `deletedAt` and appends a DELETED audit event; lists exclude deleted unless `includeDeleted=true` (BRD §13.1).

    - **Real-data guard (BR-45, QA-34; dev/stage only)**: creates must carry `isSample=true`, else 422 `non_sample_data_forbidden`; nothing persisted. Prod ignores the flag. See `iac/ci-and-data-guards.md`
    §3.

    - **Controlled-data gate (BR-44)**: free-text fields (`x-free-text`) require `controlledDataAttestation=true` (else 400 `gate:attestation_required`); a marker hit (whole-word, case-insensitive, list
    in SSM) → 422 `gate:controlled_marker`; nothing persisted, no audit event, text never logged.

    - **Audit**: every successful write appends one AuditLog event in the same transaction (BR-08, BR-46).

    - **Sample data (BR-31)**: seed items carry `isSample=true` in every env.

    - **Not routed**: `/api/ai/*` (reserved AI seam, BRD §12 #1). No `/api/search`: ⌘K is client-side over loaded lists (US-41 decision; scope DP-15). No CSV export route: the only observed CSV (agent task
    log, US-39) is deferred with AI.'
servers:
- url: /
  description: Via CloudFront only
paths:
  /api/quality-records:
    x-sentinelqa-function: records-api
    get:
      tags:
      - Quality records
      operationId: listQualityRecord
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/IncludeDeleted'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - CAPA
          - NCMR
          - SCAR
      - name: severity
        in: query
        schema: &id001
          type: string
      - name: stage
        in: query
        schema: *id001
      - name: standard
        in: query
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
