components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem+json. `code` is stable and machine-readable.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title: *id001
        status:
          type: integer
        detail: *id001
        instance: *id001
        code:
          type: string
          enum:
          - validation_failed
          - gate:attestation_required
          - gate:controlled_marker
          - not_found
          - version_conflict
          - precondition_required
          - stage_conflict
          - sod_violation
          - idempotency_conflict
          - forbidden_origin
          - rate_limited
          - internal
        fields:
          type: array
          items:
            type: object
            properties:
              name: *id001
              message: *id001
        markerId:
          type: string
          description: Matched marker id (K<n>/R<n>) is returned and shown in the 422 message. Matched text is never returned or logged (Decided DP-03, 2026-10-13; see dp-proposals.md)
          x-decision: DP-03
    Meta:
      type: object
      properties:
        id:
          type: string
          description: 'System ID <TYPE>-YYYY-NNNN (SQ/CAL: NNN), year in workspace TZ, per-type per-year sequence, immutable; soft-deleted records keep their ID reserved (Decided DP-01, 2026-10-13; see
            dp-proposals.md)'
          x-decision: DP-01
          readOnly: true
        version:
          type: integer
          description: Optimistic-concurrency counter, returned as ETag "W/\"<version>\""
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          description: Soft delete (BRD §13.1). Removed items are excluded from lists, counts and pickers.
          readOnly: true
        isSample:
          type: boolean
          description: 'BR-31: true for the illustrative seed set (labelled "ILLUSTRATIVE — SAMPLE RECORDS"). Allowed in every env. Client-settable on create only (immutable after). dev/stage: required
            true on create, else 422 non_sample_data_forbidden (BR-45, QA-34). prod: DECIDED 2026-10-13 (BR-49): a create with isSample=true returns 422 sample_flag_forbidden_in_prod, nothing persisted,
            no audit event. The UI offers no sample option; prod sample data comes only from the seed command.'
        draft:
          type:
          - object
          - 'null'
          description: 'Reserved AI seam (BRD §12 #1). Always null in this build.'
          readOnly: true
        aiAssisted:
          type: boolean
          const: false
          readOnly: true
    WriteCommon:
      type: object
      required:
      - actorName
      properties:
        actorName:
          type: string
          description: Self-asserted actor/reviewer name (BR-11). No identity yet (ADR-0008). 1–100 chars, trimmed, letters/space/.,'- (DP-04).
          minLength: 1
          maxLength: 100
        controlledDataAttestation:
          type: boolean
          description: Required true on every request that persists free text (BR-44). Missing/false → 400 gate:attestation_required. Required only on endpoints that accept a free-text field (DP-03).
    Page:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque; pass as ?cursor=. Absent on the last page.
    AuditEvent:
      type: object
      properties:
        eventId:
          type: string
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
        actorName:
          type: string
          readOnly: true
        eventType:
          type: string
          enum:
          - CREATED
          - UPDATED
          - STAGE_CHANGED
          - DELETED
          - RESTORED
          - SIGNED
          - COMPLETED
          - COMPLETION_UNDONE
          - RELEASED
          - SUPERSEDED
          - REVIEWER_DECISION
          - AI_DRAFT_ACCEPTED
          - AI_DRAFT_MODIFIED
          - AI_DRAFT_REJECTED
          readOnly: true
        fromStage:
          type: string
          readOnly: true
        toStage:
          type: string
          readOnly: true
        controlledDataAttested:
          type: boolean
          readOnly: true
        snapshot:
          type: object
          readOnly: true
      description: Append-only (BR-08, BR-46). AI_DRAFT_* are reserved and never emitted in this build.
    Transition:
      type: object
      allOf:
      - $ref: '#/components/schemas/WriteCommon'
      required:
      - fromStage
      - toStage
      properties:
        fromStage: *id001
        toStage: *id001
        comment:
          type: string
          description: 'Optional note. Free text: screened by the controlled-data gate (BR-44). Max 32 KB (DP-04).'
          maxLength: 32768
          x-free-text: true
      description: Generic stage advance; writes STAGE_CHANGED (BR-36). Conditional on current stage = fromStage (409 stage_conflict). Forward one stage at a time, no skip; only backward move is QM Review
        → Investigation with a required comment; Closed is terminal; QM Review → Closed only by a reviewer independent of the author (DP-02, DP-08).
    QualityRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/Meta'
      - $ref: '#/components/schemas/WriteCommon'
      required:
      - type
      - title
      - severity
      properties:
        type:
          type: string
          enum:
          - CAPA
          - NCMR
          - SCAR
        title:
          type: string
          description: 'Short title. Free text: screened by the controlled-data gate (BR-44). Max 32 KB (DP-04).'
          maxLength: 32768
          x-free-text: true
        description:
          type: string
          description: 'Event description. Free text: screened by the controlled-data gate (BR-44). Max 32 KB (DP-04).'
          maxLength: 32768
          x-free-text: true
        severity:
          type: string
          enum:
          - Critical
          - Major
          - Minor
        stage:
          type: string
          enum:
          - New
          - Containment
          - Investigation
          - Draft Ready
          - QM Review
          - Closed
          readOnly: true
        clause:
          type: string
          description: Standard/clause reference
        dueDate: *id004
        needByDate:
          type: string
          format: date
          description: Need-by date (BR-15, delivery details optional)
        deliveryDetails:
          type: string
          description: 'Optional. Free text: screened by the controlled-data gate (BR-44). Max 32 KB (DP-04).'
          maxLength: 32768
          x-free-text: true
        reviewerName:
          type: string
          description: BR-11
        disposition:
          type: string
          enum:
          - Use as is
          - Rework
          - Repair
          - Scrap
          - Return to supplier
        independentApprover:
          type: string
          description: Required for Use as is / Repair (BR-10). Independent = different from the author after trim/whitespace-collapse/case-fold; hard block 409 sod_violation (DP-08).
        sourceRecordId:
          type: string
          description: e.g. NCMR that raised a SCAR (OQ-23)
        stepFields:
          type: object
          description: CAPA/NCMR step 2–6 fields per the approved step specs (Decided DP-02, 2026-10-13; see dp-proposals.md)
          x-decision: DP-02
    Supplier:
      type: object
      allOf:
      - $ref: '#/components/schemas/Meta'
      - $ref: '#/components/schemas/WriteCommon'
      description: Supplier master record with create/edit (DP-10).
      properties:
        name: *id001
        commodity: *id001
        criticality:
          type: string
          enum:
          - Critical
          - Standard
        onTimePct:
          type: number
          minimum: 0
          maximum: 100
          description: Entered manually (Decided DP-10, 2026-10-13; see dp-proposals.md)
          x-decision: DP-10
        openScarCount:
          type: integer
          description: Derived from SCAR records linked by supplierId (Decided DP-10, 2026-10-13; see dp-proposals.md)
          x-decision: DP-10
          readOnly: true
        certRenewalDate: *id004
        standards:
          type: array
          items:
            type: string
            enum:
            - AMS 2750
            - AS6174
            - AS9100D
            - AS9102
            - NADCAP
            - NAS 410
        score:
          type: number
          description: 0–100 from BR-47 weights (PLACEHOLDER values, DP-16)
          readOnly: true
        band:
          type: string
          readOnly: true
        flags:
          type: array
          items: *id001
          description: 'Derived: open SCAR/CAPA linked → flag; next step text by band (Decided DP-10, 2026-10-13; see dp-proposals.md)'
          x-decision: DP-10
          readOnly: true
    SupplierQualification:
