                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/QualityRecord'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '429': &id003
          $ref: '#/components/responses/TooMany'
    post:
      tags:
      - Quality records
      operationId: createQualityRecord
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityRecord'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRecord'
          headers:
            ETag:
              schema: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '403': *id002
        '429': *id003
