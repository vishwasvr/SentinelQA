          x-decision: DP-06
          readOnly: true
        topGaps:
          type: array
          items: *id001
          readOnly: true
    Config:
      type: object
      description: BR-47 values from SSM. **PLACEHOLDER** defaults until Vishwas tunes them (DP-16). The controlled-data marker list is never exposed.
      properties:
        status:
          type: string
          const: PLACEHOLDER
          readOnly: true
        supplierRisk:
