          readOnly: true
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: *id001
    Cursor:
      name: cursor
      in: query
      schema: *id001
      description: Opaque cursor from nextCursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IncludeDeleted:
      name: includeDeleted
      in: query
      schema:
        type: boolean
        default: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Required on every POST. Same key + same body within 24 h returns the original response; same key + different body → 409 idempotency_conflict.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: *id001
      description: ETag from the last GET. Missing → 428 precondition_required; stale → 412 version_conflict.
  responses:
    BadRequest:
      description: Validation error or gate:attestation_required (BR-44)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: 'gate:controlled_marker (BR-44). Nothing persisted, no audit event. Message names the marker id; input is kept client-side only (DP-03). Also prod only: sample_flag_forbidden_in_prod
        (BR-49), isSample=true on create; nothing persisted. Also, dev/stage only: non_sample_data_forbidden (BR-45, QA-34): a create without isSample=true is rejected; nothing persisted, no audit event.
        Enabled by the env profile (ADR-0013); prod ignores it.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (or soft-deleted)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: stage_conflict, sod_violation or idempotency_conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: version_conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'forbidden_origin: request did not come through CloudFront (ADR-0015)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: rate_limited (API Gateway throttle)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
