# Deploy (delivery-strategy.md §3/§3b/§4, ci-and-data-guards.md §1.3, ADR-0012/0014/0017).
# Never runs on pull_request / pull_request_target: branch or fork code can't assume a deploy role.
# push to main      -> test -> build -> deploy-dev (stage is NOT promoted on push: the sign-off doesn't exist yet).
# workflow_dispatch -> target=dev: same as push, on main.
#                      target=stage: promote an already-built artifact (sha + build_run_id) once
#                      releases/<sha>/dev-signoff.md is on main.
name: deploy

on:
  # TEMPORARY (2026-10-13, Vishwas): push trigger disabled; manual dispatch only until the
  # Bootstrap/OIDC redeploy and build:lambdas/smoke:deployed land. To re-enable, restore:
  #   push:
  #     branches: [main]
  #     paths-ignore:
  #       - 'releases/**'
  # See docs/infrastructure/environments.md "Known drift".
  workflow_dispatch:
    inputs:
      target:
        description: 'dev (build + deploy main) or stage (promote a signed-off artifact)'
        type: choice
        options: [dev, stage]
        default: dev
      sha:
        description: 'stage only: full commit SHA whose artifact is promoted'
        type: string
        required: false
      build_run_id:
        description: 'stage only: run id of the deploy.yml run that built that SHA'
        type: string
        required: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Defence in depth: re-run the secrets scan and IaC lint on the exact commit (ci-and-data-guards §1.3 step 1).
  secrets-scan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .'

  cfn-lint:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install cfn-lint==1.57.2
      - run: cfn-lint docs/architecture/iac/templates/*.yaml

  # Unit tests + coverage gate (§3b): 90/90 overall, 100/100 safety-critical, max 1 pt drop, app code only
  # (vitest.config.ts scope). Same commands as ci.yml unit / unit-coverage.
  test:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit-lint
      - run: npm test
      - run: npm run coverage
      - name: Coverage gate (90/90 overall, 100/100 safety-critical, max 1 pt drop)
        run: node scripts/ci/coverage-gate.mjs --baseline ci/coverage-baseline.json

  # Build once (ADR-0014, §4): immutable zips keyed by commit SHA, promoted unchanged dev -> stage.
  build:
    needs: [secrets-scan, cfn-lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Version (SemVer tag if the commit is tagged vX.Y.Z, else <package version>+<sha>)
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          tag=$(git tag --points-at "$SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)
          if [ -n "$tag" ]; then version="${tag#v}"; else version="$(node -p 'require("./package.json").version')+${SHA:0:12}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Lambda zips (Developer-provided script, ADR-0014)
        run: |
          if ! node -e 'process.exit(require("./package.json").scripts?.["build:lambdas"] ? 0 : 1)'; then
            echo "::error::package.json has no 'build:lambdas' script (must write dist/records-api.zip and dist/reports-api.zip)"; exit 1
          fi
          npm run build:lambdas
          for f in records-api reports-api; do test -s "dist/$f.zip" || { echo "::error::dist/$f.zip missing"; exit 1; }; done
      - name: Manifest
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          jq -n --arg sha "$SHA" --arg version "$VERSION" \
            --arg r "$(sha256sum dist/records-api.zip | cut -d' ' -f1)" \
            --arg p "$(sha256sum dist/reports-api.zip | cut -d' ' -f1)" \
            '{sha:$sha, version:$version, sha256:{"records-api.zip":$r, "reports-api.zip":$p}}' > dist/manifest.json
          cat dist/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-zips-${{ steps.meta.outputs.sha }}
          path: |
            dist/records-api.zip
            dist/reports-api.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-zips-${{ needs.build.outputs.sha }}
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy 10-security, 20-data, 30-api, 40-web, 50-observability (change set, then execute)
        env:
          DEPLOY_ENV: dev
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          DIST_DIR: dist
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: bash scripts/ci/deploy-env.sh
      - name: Dev smoke test + QA-36 (Developer-provided; required before stage sign-off)
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["smoke:deployed"] ? 0 : 1)'; then
            npm ci && DEPLOY_ENV=dev npm run smoke:deployed
          else
            echo "::warning::No 'smoke:deployed' script yet. Run the smoke test + QA-36 (first-deploy §5b) manually before committing releases/<sha>/dev-signoff.md."
          fi

  # Stage: no required reviewer (option (c)); the gate is the Developer's dev sign-off file on main.
  deploy-stage:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'stage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, ref: main }
      - name: Gate - releases/<sha>/dev-signoff.md exists on main and names this SHA
        env:
          PROMOTE_SHA: ${{ inputs.sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$PROMOTE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::input sha must be a full 40-char commit SHA"; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::input build_run_id is required"; exit 1; }
          f="releases/${PROMOTE_SHA}/dev-signoff.md"
          test -f "$f" || { echo "::error::$f not found on main; stage promotion blocked"; exit 1; }
          grep -q "$PROMOTE_SHA" "$f" || { echo "::error::$f does not record SHA $PROMOTE_SHA"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-zips-${{ inputs.sha }}
          path: dist
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Artifact matches the signed-off SHA (same artifact as dev, never rebuilt)
        env:
          PROMOTE_SHA: ${{ inputs.sha }}
        run: |
          test "$(jq -r .sha dist/manifest.json)" = "$PROMOTE_SHA"
          for f in records-api reports-api; do
            test "$(sha256sum "dist/$f.zip" | cut -d' ' -f1)" = "$(jq -r --arg k "$f.zip" '.sha256[$k]' dist/manifest.json)"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy stage (10-security change set is created but not executed; needs Vishwas's approval)
        env:
          DEPLOY_ENV: stage
          BUILD_SHA: ${{ inputs.sha }}
          DIST_DIR: dist
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          NO_EXECUTE_STACKS: 10-security
        run: bash scripts/ci/deploy-env.sh

  # TODO(prod): not implemented. delivery-strategy §3 step 3 defines prod (same artifact from a vX.Y.Z tag,
  # environment: prod with required reviewer Vishwas, green stage run, 25-backup last, first-deploy §5a/§6 checks,
  # RollbackConfiguration alarms), but it needs the O-03 prod account split first and a cross-account artifact copy.
  # deploy-prod:
  #   environment: prod   # required reviewer: Vishwas, no self-review bypass
  #   concurrency: { group: deploy-prod, cancel-in-progress: false }
  #   permissions: { contents: read, id-token: write }
