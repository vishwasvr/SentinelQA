# CI (QA-32): lint and test. No AWS access, no OIDC, no secrets (ci-and-data-guards.md §1.1).
# Job names are the required status checks for main (delivery-strategy.md §2a).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  audit-lint:
    name: audit-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint (all code)
        run: npm run lint
      - name: Audit rule - writes only through buildAuditPut (ESLint + grep)
        run: npm run audit-lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test

  unit-coverage:
    name: unit-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run coverage
      - name: Baseline from main (a PR cannot lower its own baseline)
        run: |
          if git show origin/main:ci/coverage-baseline.json > "$RUNNER_TEMP/baseline.json" 2>/dev/null; then
            echo "Using baseline from origin/main."
          else
            echo "No baseline on main yet; using the committed one."
            cp ci/coverage-baseline.json "$RUNNER_TEMP/baseline.json"
          fi
      - name: Coverage gate (90/90 overall, 100/100 safety-critical, max 1 pt drop)
        run: node scripts/ci/coverage-gate.mjs --baseline "$RUNNER_TEMP/baseline.json"

  openapi-contract:
    name: openapi-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: pip install pyyaml==6.0.2 openapi-spec-validator==0.7.1
      - run: bash scripts/ci/openapi-contract.sh

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: pip install cfn-lint==1.57.2
      - run: cfn-lint docs/architecture/iac/templates/*.yaml

  seed-fixture-lint:
    name: seed-fixture-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: node scripts/ci/seed-fixture-lint.mjs seed

  releases-path-check:
    name: releases-path-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: A PR touching releases/** changes nothing else
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/releases-path-check.mjs "$BASE_SHA" "$HEAD_SHA"
